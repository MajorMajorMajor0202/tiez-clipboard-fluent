<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TieZ</title>
    <style>
      html:root.settings-startup, html:root.settings-startup body, html:root.settings-startup #root,
      html:root.settings-startup body.is-settings-window, html:root.settings-startup body.is-settings-window #root {
        background-color: var(--settings-startup-background, #202020) !important;
      }
    </style>
    <script>
      // Run before the module/CSS bundle: even a delayed WebView first paint is opaque.
      if (new URLSearchParams(location.search).get('window') === 'settings') {
        var startupMode = new URLSearchParams(location.search).get('color_mode');
        var startupDark = startupMode === 'dark' || (startupMode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.style.setProperty('--settings-startup-background', startupDark ? '#202020' : '#f3f3f3');
        document.documentElement.classList.add('settings-startup');
      }
    </script>
    <script>
      window.addEventListener('error', function(e) {
        var msg = '[JS_ERROR] ' + (e.error ? (e.error.stack || e.error.message) : e.message) + ' (' + e.filename + ':' + e.lineno + ')';
        try { localStorage.setItem('__tiez_last_error', msg); } catch(x) {}
        console.error(msg);
        var el = document.getElementById('tiez-fatal-error-overlay');
        if (!el) {
          el = document.createElement('div');
          el.id = 'tiez-fatal-error-overlay';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(180,0,0,0.95);color:#fff;z-index:2147483647;padding:20px;font-family:Consolas,monospace;font-size:12px;overflow:auto;user-select:text;white-space:pre-wrap;line-height:1.5;';
          (document.body || document.documentElement).appendChild(el);
        }
        el.innerText += '\n' + msg + '\n';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var msg = '[PROMISE_REJECTION] ' + (e.reason ? (e.reason.stack || e.reason) : e);
        try { localStorage.setItem('__tiez_last_rejection', msg); } catch(x) {}
        console.error(msg);
        var el = document.getElementById('tiez-fatal-error-overlay');
        if (!el) {
          el = document.createElement('div');
          el.id = 'tiez-fatal-error-overlay';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(180,0,0,0.95);color:#fff;z-index:2147483647;padding:20px;font-family:Consolas,monospace;font-size:12px;overflow:auto;user-select:text;white-space:pre-wrap;line-height:1.5;';
          (document.body || document.documentElement).appendChild(el);
        }
        el.innerText += '\n' + msg + '\n';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
